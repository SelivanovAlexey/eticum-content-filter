apply plugin: 'java-library'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
    api("com.google.guava:guava:24.1-jre")
    api("io.netty:netty-all:4.1.55.Final")
    implementation("org.apache.commons:commons-lang3:3.5")
    implementation('org.slf4j:slf4j-android:1.6.1-RC1')
    implementation("org.littleshoot:dnssec4j:0.1.6"){
        exclude group: 'org.littleshoot', module: 'dnsjava'
        exclude group: 'org.slf4j'
    }
    implementation("commons-cli:commons-cli:1.3.1")
}