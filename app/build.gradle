apply plugin: 'com.android.application'

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.2"

    defaultConfig {
        applicationId "com.eticum"
        minSdkVersion 29
        targetSdkVersion 30
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures{
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation project(path: ':littleshoot')
    implementation ('androidx.appcompat:appcompat:1.2.0')
    implementation ('androidx.constraintlayout:constraintlayout:2.0.4')
    androidTestImplementation ('androidx.test.ext:junit:1.1.2')
    androidTestImplementation ('androidx.test.espresso:espresso-core:3.3.0')
    implementation('com.squareup.retrofit2:retrofit:2.8.2') {
        exclude module: 'okhttp'
    }
    implementation('com.google.android.material:material:1.3.0')
    implementation('androidx.coordinatorlayout:coordinatorlayout:1.1.0')
    implementation('com.github.bumptech.glide:glide:4.11.0')
    implementation('com.squareup.retrofit2:converter-jackson:2.8.2')
    implementation('com.squareup.okhttp3:logging-interceptor:4.7.1')
    implementation('androidx.cardview:cardview:1.0.0')
    implementation('androidx.recyclerview:recyclerview:1.1.0')
    implementation('androidx.constraintlayout:constraintlayout:2.0.4')
    implementation('androidx.drawerlayout:drawerlayout:1.1.1')
    compileOnly('org.projectlombok:lombok:1.18.16')
    implementation('org.slf4j:slf4j-android:1.6.1-RC1')
    annotationProcessor('org.projectlombok:lombok:1.18.16')
    implementation(group: 'commons-io', name: 'commons-io', version: '2.6')
    implementation group: 'org.apache.commons', name: 'commons-collections4', version: '4.4'
    implementation("org.apache.commons:commons-lang3:3.5")
    implementation('org.nanohttpd:nanohttpd:2.3.1')
    implementation('org.nanohttpd:nanohttpd-nanolets:2.3.1')
    implementation('androidx.navigation:navigation-ui:2.3.4')
    implementation('androidx.navigation:navigation-fragment:2.3.4')
    implementation('androidx.lifecycle:lifecycle-extensions:2.2.0')
    implementation('androidx.security:security-crypto:1.1.0-alpha03')
    implementation('com.andrognito.pinlockview:pinlockview:2.1.0')
    implementation('com.github.ganskef:littleproxy-mitm:1.1.0') {
        exclude group: 'org.slf4j'
        exclude group: 'com.barchart.udt'
        exclude group: 'org.littleshoot'
    }
    implementation 'joda-time:joda-time:2.10.6'

}